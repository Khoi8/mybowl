# tygo config — generates TypeScript wire types FROM the Go sync structs.
#
# Go is the SOURCE OF TRUTH for the sync WIRE types (CLAUDE.md §12 phase 7:
# "invert the type direction — generate TS wire types FROM Go"). The device's
# hand-authored domain types in packages/shared/src/index.ts are a SEPARATE
# vocabulary; apps/mobile/src/sync/wireMap.ts maps between the two.
#
# Regenerate (from services/api/) with:
#   go run github.com/gzuidhof/tygo@latest generate
#
# The output (packages/shared/generated/wire.ts) is GENERATED — never hand-edit
# it; change the Go structs + json tags in internal/domain/sync.go and rerun.
packages:
  - path: github.com/khoi8/mybowl/services/api/internal/domain
    output_path: ../../packages/shared/generated/wire.ts
    # Only sync.go carries the wire transport types. Excluding everything else
    # keeps server-internal helpers (LWW Existing/Incoming, errors) off the wire.
    include_files:
      - sync.go
    # Go's int/int64 both serialize as JSON numbers.
    type_mappings:
      int64: number
      int: number
    # Go's `any` (the value type of map[string]any payload/row) maps to
    # `unknown`, not `any` — the repo bans `any` (eslint no-explicit-any), and
    # `unknown` matches the device's `payload: unknown` in outbox.ts.
    fallback_type: unknown
    frontmatter: |
      /**
       * THIS FILE IS GENERATED by tygo from
       * services/api/internal/domain/sync.go — DO NOT EDIT BY HAND.
       *
       * Go is the source of truth for the sync WIRE types. To regenerate, run
       * from services/api/:
       *   go run github.com/gzuidhof/tygo@latest generate
       *
       * The device's hand-authored domain types (packages/shared/src/index.ts)
       * are a separate vocabulary; apps/mobile/src/sync/wireMap.ts maps the
       * local op shape to/from these wire types and is the single seam where
       * Go↔TS drift surfaces as a compile error.
       */
